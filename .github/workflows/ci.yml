name: CI

on:
  push:
    branches: [dev, main, "debugging-&-error-correction"]
  pull_request:
    branches: [dev, main, "debugging-&-error-correction"]

jobs:
  backend-quality:
    name: Backend Quality (Python & pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check backend/

      - name: Run security tests with pytest
        run: pytest backend/tests -v

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npx tsc -b

      - name: Run Unit Tests & Coverage (MSW Offline Suite)
        run: npm run test:coverage

      - name: Verify 3D Era Car Models & Budgets
        run: npm run models:verify

      - name: Build Production Bundle
        run: npm run build

      - name: Enforce Bundle Size Budgets
        run: npm run size

      - name: Audit Performance & Accessibility (Lighthouse CI)
        run: npm run audit:lighthouse

      - name: Run ETL Invariant Tests
        run: npx vitest run scripts/etl/__tests__

      - name: Run Telemetry Pack Invariant Tests
        run: npx vitest run scripts/telemetry/__tests__/telemetryPackInvariants.test.ts

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E Integration Suite (SwiftShader Headless)
        run: npm run test:e2e
